<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="Building. Learning. Sharing.">
  <style>
    text { font-family: Consolas, Menlo, monospace; font-size: 22px; fill: #36bcf7; }
  </style>
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="44">
        <animate attributeName="width" values="0;900;900;0" keyTimes="0;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <text x="450" y="30" text-anchor="middle" clip-path="url(#reveal)">&gt; Building scalable software. Learning every day. Sharing it all.</text>
</svg>
